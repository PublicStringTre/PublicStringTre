<svg
xmlns="http://www.w3.org/2000/svg"
width="1000"
height="590"
viewBox="0 0 1000 590"
role="img"
aria-labelledby="title desc">

<title id="title">
PublicStringTre GitHub Telemetry
</title>

<desc id="desc">
All-time GitHub statistics and recent activity
for Anthony Fieldings III.
</desc>

<defs>

    <linearGradient
        id="background"
        x1="0"
        y1="0"
        x2="1"
        y2="1"
    >
        <stop
            offset="0%"
            stop-color="#08080d"
        />

        <stop
            offset="60%"
            stop-color="#0d0914"
        />

        <stop
            offset="100%"
            stop-color="#160923"
        />
    </linearGradient>

    <linearGradient
        id="graphGradient"
        x1="0"
        y1="0"
        x2="1"
        y2="0"
    >
        <stop
            offset="0%"
            stop-color="#7c3aed"
        />

        <stop
            offset="50%"
            stop-color="#c084fc"
        />

        <stop
            offset="100%"
            stop-color="#8b5cf6"
        />
    </linearGradient>

    <filter
        id="glow"
        x="-50%"
        y="-50%"
        width="200%"
        height="200%"
    >
        <feGaussianBlur
            stdDeviation="3"
            result="blur"
        />

        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

</defs>


<!-- BACKGROUND -->

<rect
    x="1"
    y="1"
    width="998"
    height="588"
    rx="18"
    fill="url(#background)"
    stroke="#342044"
    stroke-width="2"
/>


